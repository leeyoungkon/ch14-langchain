apiVersion: v1
kind: ConfigMap
metadata:
  name: order-analysis-langgraph
data:
  ORDERS_PARQUET_URI: "s3://warehouse/raw/stud12/**/*.parquet"
  S3_ENDPOINT: "https://aistor-server.aistor-server.svc.cluster.local:443"
  S3_VERIFY_SSL: "false"
  S3_ACCESS_KEY: "admin"
  S3_SECRET_KEY: "admin1234"
  CUSTOMER_MCP_URL: "http://customer-mcp.default.svc.cluster.local:8000/mcp"
  OLLAMA_BASE_URL: "http://ollama.default.svc.cluster.local:11434"
  CHAT_MODEL: "qwen3:8b"
  OLLAMA_TIMEOUT: "180"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-analysis-langgraph
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-analysis-langgraph
  template:
    metadata:
      labels:
        app: order-analysis-langgraph
    spec:
      automountServiceAccountToken: false
      containers:
        - name: order-analysis-langgraph
          image: yklee2002/order-analysis-langgraph
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: order-analysis-langgraph
          readinessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: order-analysis-langgraph
spec:
  type: ClusterIP
  selector:
    app: order-analysis-langgraph
  ports:
    - name: http
      port: 8000
      targetPort: http
