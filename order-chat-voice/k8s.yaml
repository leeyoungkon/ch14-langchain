apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-chat-voice
spec:
  replicas: 1
  selector:
    matchLabels: {app: order-chat-voice}
  template:
    metadata:
      labels: {app: order-chat-voice}
    spec:
      containers:
        - name: app
          image: yklee2002/order-chat-voice
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: order-chat-voice
spec:
  type: NodePort
  selector: {app: order-chat-voice}
  ports:
    - {port: 8000, targetPort: 8000, nodePort: 30119}
