apiVersion: v1
kind: ConfigMap
metadata:
  name: order-multiagent-config
  namespace: stud12
data:
  ORDERS_PARQUET_URI: "s3://warehouse/raw/stud12/**/*.parquet"
  S3_ENDPOINT: "https://aistor-server.aistor-server.svc.cluster.local:443"
  S3_VERIFY_SSL: "false"
  S3_REGION: "us-east-1"
  S3_ACCESS_KEY: "admin"
  S3_SECRET_KEY: "admin1234"
  CUSTOMER_MCP_URL: "http://customer-mcp:8000/mcp"
  OLLAMA_BASE_URL: "http://ollama.default.svc.cluster.local:11434"
  CHAT_MODEL: "qwen3:8b"
  OLLAMA_TIMEOUT: "180"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-multiagent
  namespace: stud12
spec:
  replicas: 1
  selector:
    matchLabels: {app: order-multiagent}
  template:
    metadata:
      labels: {app: order-multiagent}
    spec:
      containers:
      - name: app
        image: yklee2002/order-multiagent
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef: {name: order-multiagent-config}
        readinessProbe:
          httpGet: {path: /health, port: 8000}
          initialDelaySeconds: 8
          periodSeconds: 10
        resources:
          requests: {cpu: 250m, memory: 512Mi}
          limits: {cpu: "2", memory: 2Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: order-multiagent
  namespace: stud12
spec:
  type: ClusterIP
  selector: {app: order-multiagent}
  ports:
  - name: http
    port: 8000
    targetPort: 8000
